name: refresh-judges

# Daily scrape of https://www.vekn.net/vekn-judges → data/judges.json.
# Commits + pushes only if the parsed list differs from what's checked
# in, then dispatches the CI workflow on `main`, which redeploys
# judge.vtesitaly.com. If vekn.net is down
# (network error / 5xx) the job passes with a warning annotation; if it
# changed its markup or moved the page, scripts/fetch-judges.mjs exits
# non-zero and the job fails. Neither touches the repo — the previous
# snapshot keeps serving in production.

on:
  schedule:
    # Daily at 06:00 UTC. Italian judges renew on 3-year cycles, so the
    # list changes a handful of times a year — once a day is plenty,
    # and 06:00 UTC means a fresh list is online before the EU morning.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-judges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Writable token for the bot push back to main: the default
          # GITHUB_TOKEN has contents:write per the permissions block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Scrape VEKN judges
        run: node scripts/fetch-judges.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- data/judges.json; then
            echo "No changes to data/judges.json — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Default github-actions[bot] identity. No local hooks run here:
          # the full lint/test/typecheck pipeline runs in the CI workflow
          # dispatched below, so quality gates are preserved.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/judges.json
          git commit -m "chore(judges): refresh Italian judges list from vekn.net"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the default GITHUB_TOKEN don't fan out to other
      # workflows (Actions blocks the loop). Trigger CI explicitly so
      # the just-pushed judges.json reaches production within the same
      # cron tick — without needing a Personal Access Token secret.
      - name: Dispatch CI to deploy the refreshed list
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --ref main
